coverage:
  precision: 2
  round: down
  range: "50...100"

  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        target: auto
        threshold: 1%
        informational: true

flags:
  backend:
    paths:
      - backend/app/
    carryforward: true
  frontend:
    paths:
      - frontend/src/
    carryforward: true

ignore:
  - "e2e/"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "backend/tests/"
  - "frontend/src/test/"

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
