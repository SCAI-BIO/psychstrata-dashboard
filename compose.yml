name: psychstrata-dashboard

services:
  backend:
    build:
      context: ./backend
    environment:
      BACKEND_BASIC_AUTH_USERNAME: ${BACKEND_BASIC_AUTH_USERNAME:-}
      BACKEND_BASIC_AUTH_PASSWORD: ${BACKEND_BASIC_AUTH_PASSWORD:-}
      BACKEND_DATABASE_URL: ${BACKEND_DATABASE_URL:-sqlite:////data/db.sqlite3}
      LLM_PROVIDER_URL: ${LLM_PROVIDER_URL:-https://fhgenie.fraunhofer.de/v1}
      LLM_PROVIDER_MODEL: ${LLM_PROVIDER_MODEL:-Qwen/Qwen3-Coder-Next-FP8}
      LLM_PROVIDER_KEY: ${LLM_PROVIDER_KEY:-}
    volumes:
      - backend_data:/data
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health').read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      target: production
      args:
        VITE_API_BASE_URL: ""
    environment:
      BACKEND_HOST: backend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_data: