name: Zenodo Metadata

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Sync Zenodo metadata
      uses: tiadams/zenodo-schema-sync@v1.0.0
      with:
        mode: sync
        token: ${{ secrets.ZENODO_TOKEN }}
